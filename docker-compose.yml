services:
  typst-blog:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: typst-blog
    restart: unless-stopped
    ports:
      - "${PORT:-8088}:3000"
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
      - SESSION_SECRET=${SESSION_SECRET:-typst-blog-super-secret-key-change-in-production}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-false}
      - SITE_TITLE=${SITE_TITLE:-Typst Blog}
      - SITE_DESCRIPTION=${SITE_DESCRIPTION:-Moteur de blog moderne propulsé par Typst et SvelteKit}
      - BODY_SIZE_LIMIT=${BODY_SIZE_LIMIT:-25M}
    volumes:
      - typst_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  typst_data:
    driver: local
